        <h2>تخصص‌های مهندسی</h2>
        <ul>
          <li><strong>سیستم‌های آسانسور:</strong> محاسبات ترافیک ساختمانی، آسانسورهای کششی و هیدرولیک، موتورهای روملس (MRL) و گیرلس، درایوهای VVVF بر اساس استاندارد EN 81-20 و EN 81-50.</li>

          <li><strong>مهندسی برق و اتوماسیون:</strong> طراحی تابلوهای توزیع و فرمان، سیستم‌های نجات اضطراری (Blackout) و ارتینگ حفاظتی.</li>
