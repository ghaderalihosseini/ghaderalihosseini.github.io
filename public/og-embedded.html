    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #000000;
      font-family: 'Shabnam', sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 65%);
      pointer-events: none;
    }

    .glass-card {
      width: 1080px;
      height: 520px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 60%, rgba(0, 0, 0, 0.6) 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 38px;
      padding: 55px 65px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .card-sheen {
      position: absolute;
      top: 0;
      left: 70px;
      right: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-capsule {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 9px 20px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px #ffffff;
    }

    .domain-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 19px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-size: 60px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }

    .hero-desc {
      font-size: 20px;
      color: #cbd5e1;
      line-height: 1.6;
      max-width: 880px;
      font-weight: 400;
    }

    .badges-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .badge {
      padding: 10px 22px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>

    <div>
